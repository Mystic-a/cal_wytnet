services:
  # Backend API Service
  - type: web
    name: calculator-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: calculator-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://calculator-frontend-ley2.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://calculator-backend-z6k9.onrender.com/auth/google/callback

  # Frontend Static Site
  - type: web
    name: calculator-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://calculator-backend-z6k9.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# PostgreSQL Database
databases:
  - name: calculator-db
    plan: free
    databaseName: calculator
    user: calculator_user